# Local development stack. `pnpm infra:up` (scripts/infra-up.mjs) checks the ports, brings this
# up, requires both one-shot initialisers to have succeeded, and waits for health.
#
# MONGO_PORT (default 27018) moves MongoDB when something else holds that port. Set it in .env
# and point MONGODB_URI and MONGODB_AUDIT_URI at the same port.
#
# MongoDB runs as a SINGLE-NODE REPLICA SET, not a standalone. Transactions
# (section 8.10) and change streams (section 13.4) do not exist without one, and a
# standalone fails those paths late rather than loudly. See docs/adr/0015.
services:
  mongo:
    image: mongo:7.0
    container_name: clinic-mongo
    # Port 27018, not the default 27017, so this stack never collides with another
    # MongoDB already running on the machine. The container listens on the SAME port
    # it is published on, because the replica set advertises its own address: a
    # host:container port mismatch would make the driver discover a member address
    # that points somewhere else entirely. MONGO_PORT changes all of them together.
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '${MONGO_PORT:-27018}']
    ports:
      - '${MONGO_PORT:-27018}:${MONGO_PORT:-27018}'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Deliberately asserts rs.status(), not a plain ping: the container is only
      # "healthy" once mongo-init has actually initiated the replica set.
      test:
        [
          'CMD',
          'mongosh',
          '--port',
          '${MONGO_PORT:-27018}',
          '--quiet',
          '--eval',
          'rs.status().ok === 1 || quit(1)',
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  mongo-init:
    image: mongo:7.0
    container_name: clinic-mongo-init
    depends_on:
      mongo:
        condition: service_started
    restart: 'no'
    environment:
      MONGO_PORT: '${MONGO_PORT:-27018}'
    # Bounded: a mongod that never comes up (its port taken, say) fails setup within a minute
    # and says so, instead of this container waiting for ever.
    entrypoint:
      - bash
      - -c
      - |
        for attempt in $$(seq 1 60); do
          mongosh --host "mongo:$$MONGO_PORT" --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1 && break
          if [ "$$attempt" = 60 ]; then echo "mongod did not answer on port $$MONGO_PORT within 60s" >&2; exit 1; fi
          echo "waiting for mongod..."; sleep 1
        done
        mongosh --host "mongo:$$MONGO_PORT" --quiet --eval '
          const host = "localhost:" + process.env.MONGO_PORT;
          let config = null;
          try { config = rs.conf(); } catch (e) { config = null; }
          if (config === null) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host }] });
            print("replica set rs0 initiated at " + host);
          } else if (config.members[0].host !== host) {
            // The port moved since the set was initiated. Only the advertised address changes;
            // the data in the volume is untouched.
            config.members[0].host = host;
            rs.reconfig(config, { force: true });
            print("replica set rs0 now advertises " + host);
          } else {
            print("replica set already initiated at " + host);
          }
        '

  redis:
    image: redis:7.4-alpine
    container_name: clinic-redis
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # The same MinIO release, from Bitnami's archive. MinIO no longer serves its images publicly:
    # quay.io answers 401 and the Docker Hub repository is gone, so the old pins stopped pulling
    # on every fresh machine — CI included — while a cached image hid it locally. Bitnami's
    # entrypoint is bypassed so the server runs exactly as the upstream image did, as root, on
    # the same volume.
    image: bitnamilegacy/minio:2024.12.18
    container_name: clinic-minio
    user: '0'
    entrypoint: ['minio']
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: clinic
      MINIO_ROOT_PASSWORD: clinic-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: bitnamilegacy/minio-client:2024.11.21
    container_name: clinic-minio-init
    user: '0'
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 clinic clinic-dev-secret &&
        mc mb --ignore-existing local/clinic-dev &&
        mc anonymous set none local/clinic-dev &&
        echo "bucket clinic-dev ready (private)"

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: clinic-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  mongo-data:
  redis-data:
  minio-data:
