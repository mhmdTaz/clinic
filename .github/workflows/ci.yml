name: CI

on:
  push:
    branches: [dev, develop, 'feat/**']
  pull_request:
    branches: [dev, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, types, graph, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture boundaries
        # Fails on a cycle, a framework import inside packages/core, a deep
        # cross-module import, or an app reaching past a use case to the database.
        run: pnpm graph

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: cp .env.example .env && pnpm build

  database:
    name: Migrations, seed and live tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start the stack
        # The same compose file developers run locally, so CI cannot drift from it.
        # A GitHub `services:` block cannot run rs.initiate(), and object storage is part of
        # the stack from Phase 4: files and prescription PDFs are tested against real storage,
        # never a stub, because a presigned upload is exactly the part a stub would get wrong.
        #
        # `--wait` covers the long-running services only. It waits for "running and healthy", so
        # a one-shot initialiser that does its job and exits reads to it as a container that went
        # away, and it returns 1 — even on a clean exit 0. That was always true of mongo-init;
        # it only passed because compose usually saw it already gone before the wait began, and
        # a second initialiser made that race lose. The initialisers are therefore waited on with
        # `docker wait`, which is what actually answers "did it finish, and did it work".
        run: |
          docker compose up -d mongo mongo-init redis mailpit minio minio-init
          docker compose up -d --wait mongo redis mailpit minio
          for container in clinic-mongo-init clinic-minio-init; do
            code=$(docker wait "$container")
            if [ "$code" != "0" ]; then
              echo "::error::$container exited with $code"
              docker logs "$container"
              exit 1
            fi
          done

      - name: Environment
        run: cp .env.example .env

      - name: Migrate
        run: pnpm db:migrate

      - name: Migrations are reversible
        # A migration that cannot be rolled back cannot be deployed with confidence.
        # Roll back until nothing is applied, then forward again.
        run: |
          for attempt in $(seq 1 50); do
            pnpm --silent --filter @clinic/db migrate:status | grep -q APPLIED || break
            pnpm --filter @clinic/db migrate:down
          done
          pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      - name: Seed is idempotent
        run: pnpm db:seed

      - name: Verify transactions and change streams
        run: pnpm db:verify

      - name: Live database tests
        run: pnpm test:integration

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 100

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start the stack
        # The same compose file developers run locally, so CI cannot drift from it.
        # A GitHub `services:` block cannot run rs.initiate(), and object storage is part of
        # the stack from Phase 4: files and prescription PDFs are tested against real storage,
        # never a stub, because a presigned upload is exactly the part a stub would get wrong.
        #
        # `--wait` covers the long-running services only. It waits for "running and healthy", so
        # a one-shot initialiser that does its job and exits reads to it as a container that went
        # away, and it returns 1 — even on a clean exit 0. That was always true of mongo-init;
        # it only passed because compose usually saw it already gone before the wait began, and
        # a second initialiser made that race lose. The initialisers are therefore waited on with
        # `docker wait`, which is what actually answers "did it finish, and did it work".
        run: |
          docker compose up -d mongo mongo-init redis mailpit minio minio-init
          docker compose up -d --wait mongo redis mailpit minio
          for container in clinic-mongo-init clinic-minio-init; do
            code=$(docker wait "$container")
            if [ "$code" != "0" ]; then
              echo "::error::$container exited with $code"
              docker logs "$container"
              exit 1
            fi
          done

      - name: Environment
        run: cp .env.example .env

      - name: Browser
        run: pnpm --filter @clinic/e2e exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Journeys
        run: pnpm test:e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
